<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2a36">
<title>Краба Море — магазин морских деликатесов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#d8262c;--red2:#b5151b;--gold:#e4b45a;--beige:#f4e9d6;
  --ocean1:#0a2a36;--ocean2:#0f4152;--ocean3:#155468;
  --bg:#0a2a36;--surface:#0f3a49;--surface2:#134657;--line:rgba(170,215,230,.22);
  --text:#f6f1e7;--muted:#a8c4cd;--pc:#fff;--pctext:#1d1412;--pcmuted:#7b6a66;
  --shadow:0 10px 28px rgba(0,0,0,.28);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
[data-theme=light]{
  --bg:#fbf4ea;--surface:#ffffff;--surface2:#fff8ef;--line:#ead8c4;
  --text:#24302f;--muted:#6f7f80;--shadow:0 8px 22px rgba(60,40,20,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
body{min-height:100vh;
  background:
      linear-gradient(180deg,rgba(10,42,54,.15),rgba(8,30,40,.55)),url(img/bg_ocean.jpg) center top/cover,var(--bg);
  background-attachment:fixed}
[data-theme=light] body{background:var(--bg)}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(84px + var(--safe-b));min-height:100vh;position:relative}
.hidden{display:none!important}

/* HEADER */
.hdr{position:relative;overflow:hidden;padding:calc(16px + var(--safe-t)) 16px 14px;
  background:linear-gradient(180deg,rgba(8,34,45,.55) 0%,rgba(8,34,45,.25) 70%,rgba(8,34,45,0) 100%)}
[data-theme=light] .hdr{background:linear-gradient(180deg,#0c3342 0%,#0e3b4b 75%,#0e3b4b 100%);border-radius:0 0 26px 26px;padding-bottom:16px}
.hdr .hero{position:absolute;right:-6px;top:0;width:60%;height:270px;background:url(img/hero.jpg) center/cover;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%),linear-gradient(0deg,transparent 0,#000 30%);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 34%);mask-composite:intersect}
.hdr .theme{position:absolute;right:14px;top:calc(12px + var(--safe-t));width:44px;height:44px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.55);background:rgba(8,35,45,.55);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:3;color:#fff}
.brand{position:relative;z-index:2;width:68%;min-width:220px}
.logo{display:flex;flex-direction:column;align-items:center;width:max-content;color:#fff}
.logo svg.crab{width:74px;height:51px;margin-bottom:6px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45))}
.logo .name{font-family:Lora,Georgia,serif;font-weight:700;font-size:31px;letter-spacing:.2px;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.logo .wave{width:150px;height:12px;margin:3px 0 4px;opacity:.9}
.logo .sub{font-size:11.5px;font-weight:600;letter-spacing:1.6px;text-align:center;line-height:1.35;text-transform:uppercase}
.meta{margin-top:12px;display:grid;gap:6px;font-size:12.5px;white-space:nowrap;font-weight:600;color:#fff}
.meta div{display:flex;align-items:center;gap:7px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.meta svg{flex:none;color:var(--gold)}
.seg{position:relative;z-index:2;margin-top:18px;display:grid;grid-template-columns:1fr 1fr;padding:5px;border-radius:22px;
  background:rgba(8,36,46,.75);border:1.5px solid var(--line);backdrop-filter:blur(8px)}
.seg button{border:0;background:transparent;height:52px;border-radius:17px;font-weight:800;font-size:16.5px;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s}
.seg button.on{background:var(--beige);color:#1c2a2e;box-shadow:0 4px 14px rgba(0,0,0,.25)}

/* features */
.feats{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 12px 4px}
.feat{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;font-size:13px;font-weight:700;line-height:1.2;padding:0 4px}
.feat+.feat{border-left:1px solid var(--line)}
.feat .ic{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
[data-theme=light] .feat .ic{border-color:#c9b49c}

/* promo */
.promo{margin:16px 12px 0;height:104px;border-radius:24px;position:relative;overflow:hidden;display:flex;align-items:center;cursor:pointer;isolation:isolate;
  background:linear-gradient(110deg,#a80f15 0%,#d61f26 38%,#e8333a 60%,#b3121a 100%);
  box-shadow:0 14px 30px rgba(150,10,15,.45),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.18);border:1px solid rgba(255,190,170,.35);transition:transform .15s}
.promo:active{transform:scale(.985)}
.promo .pr-img{position:absolute;right:0;top:0;bottom:0;width:52%;background:url(img/hero.jpg) 30% 55%/cover;z-index:-1;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 70%);mask-image:linear-gradient(90deg,transparent,#000 70%);opacity:.55;mix-blend-mode:luminosity}
.promo:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(300px 140px at 18% 0,rgba(255,170,120,.55),transparent 70%),radial-gradient(240px 120px at 100% 100%,rgba(90,0,5,.55),transparent 70%)}
.promo .pr-shine{position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite;z-index:1}
@keyframes shine{0%,62%{left:-80px}100%{left:110%}}
.promo .tag{position:relative;width:92px;height:84px;flex:none;margin-left:2px}
@media (max-width:370px){.promo .t1{font-size:18px}.promo .t2{display:none}}
.promo .t{position:relative;flex:1;color:#fff;z-index:2}
.promo .t1{font-weight:800;font-size:20px;white-space:nowrap;letter-spacing:.2px;text-shadow:0 2px 8px rgba(80,0,0,.45)}
.promo .t2{font-size:12px;font-weight:600;opacity:.92;margin-top:4px;white-space:nowrap}
.promo .go{position:relative;z-index:2;width:46px;height:46px;border-radius:50%;background:#fff;color:#c4161c;display:grid;place-items:center;margin-right:14px;flex:none;
  box-shadow:0 0 0 6px rgba(255,255,255,.18),0 6px 14px rgba(80,0,0,.35);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(255,255,255,.06),0 6px 14px rgba(80,0,0,.35)}}
@media (prefers-reduced-motion:reduce){.promo .pr-shine,.promo .go{animation:none}}

/* sections */
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;margin:22px 14px 12px}
.sec-h h2{margin:0;font-size:27px;font-weight:800;position:relative}
.sec-h h2:after{content:"";position:absolute;left:100%;bottom:7px;width:64px;height:4px;margin-left:6px;border-radius:4px;background:linear-gradient(90deg,var(--gold),transparent)}
.sec-h .lnk{background:none;border:0;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;color:var(--text)}
.search{margin:0 12px 12px;position:relative}
.search input{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);padding:0 40px 0 42px;outline:none}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:13px;top:13px;color:var(--muted)}
.search .clr{position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;background:none;color:var(--muted);font-size:20px}
.cats{display:flex;gap:9px;overflow-x:auto;padding:2px 12px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:84px;height:84px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);overflow:hidden;position:relative;display:flex;flex-direction:column;padding:0}
.cat .ph{height:52px;background-size:cover;background-position:center;display:grid;place-items:center}
.cat .lb{flex:1;display:grid;place-items:center;font-weight:700;font-size:12.5px;padding:0 3px;line-height:1.05;text-align:center}
.cat.all{justify-content:center;align-items:center;gap:6px}
.cat.all .lb{flex:none;font-size:15px}
.cat.on{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold) inset,0 0 14px rgba(228,180,90,.35)}
.sorts{display:flex;gap:8px;padding:8px 12px 2px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:13px;color:var(--muted)}
.chip.on{background:var(--beige);color:#1c2a2e;border-color:var(--beige)}
.count{padding:8px 14px 0;font-size:12.5px;color:var(--muted)}

/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:var(--pc);color:var(--pctext);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.25);cursor:pointer;position:relative}
.card .im{aspect-ratio:1.18/1;background:#0f3d4c center/cover;position:relative}
.card .bd{padding:10px 11px 11px;display:flex;flex-direction:column;flex:1}
.card h3{margin:0;font-size:14.5px;font-weight:700;line-height:1.22;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:53px}
.price{margin:8px 0 10px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.price b{color:var(--red);font-size:19px;font-weight:800}
.price s{color:var(--pcmuted);font-size:11.5px}
.price span{color:var(--pcmuted);font-size:12.5px;font-weight:600}
.btn{border:0;height:42px;border-radius:12px;background:var(--red);color:#fff;font-weight:800;font-size:14.5px;width:100%;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1.5px solid var(--red);color:var(--red)}
.btn.dark{background:#5e1e22}
.btn.beige{background:var(--beige);color:#1c2a2e}
.card .bd .btn,.card .bd .step{margin-top:auto}
.step{display:flex;align-items:center;justify-content:space-between;height:42px;border-radius:12px;background:#fbeaea;color:var(--red);font-weight:800}
.step button{width:42px;height:42px;border:0;background:var(--red);color:#fff;border-radius:12px;font-size:20px;font-weight:700}
.badge{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:12px;font-weight:800;padding:5px 10px;border-radius:9px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.badge.sale{background:linear-gradient(135deg,#ffd36b,#e4a63a);color:#3a1d00;font-size:13px}
.badge.own{top:auto;bottom:10px;background:rgba(10,42,54,.85);font-weight:700;font-size:11px}
.ph-ill{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#1c6a80,#0b3442 70%)}
.ph-ill svg{width:44%;height:auto;opacity:.95}
.more{margin:4px 12px 16px;width:calc(100% - 24px)}
.empty{text-align:center;padding:40px 24px;color:var(--muted);font-weight:600;line-height:1.5}
.empty .big{font-size:42px;margin-bottom:8px}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;padding:0 16px}

/* panels */
.page{padding:0 12px}
.page h2{font-size:25px;font-weight:800;margin:20px 4px 14px}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.li-name{font-weight:700;font-size:14.5px;line-height:1.25}
.li-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--red);background:transparent;color:var(--red);font-weight:800;font-size:18px;line-height:1}
.qty span{min-width:46px;text-align:center;font-weight:800}
.tot{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px}
.tot b{color:var(--red);font-size:22px}
[data-theme=dark] .tot b{color:#ff6b6f}
label.f{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
.in{width:100%;height:48px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface2);color:var(--text);padding:0 14px;outline:none}
textarea.in{height:84px;padding:12px 14px;resize:vertical}
.in:focus{border-color:var(--gold)}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radios button{height:46px;border-radius:13px;border:1.5px solid var(--line);background:transparent;font-weight:700}
.radios button.on{background:var(--beige);color:#1c2a2e;border-color:var(--beige)}
.err{color:#ff6b6f;font-size:13px;font-weight:600;margin-top:8px}
.news{border-left:4px solid var(--red)}
.news .t{font-weight:800;font-size:15.5px}
.news p{margin:6px 0;line-height:1.45}
.news .d{font-size:12px;color:var(--muted)}
.sw{width:52px;height:30px;border-radius:15px;border:0;background:#5d7179;position:relative;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--red)}.sw.on:after{left:25px}
.info p{margin:0 0 14px}.info p:last-child{margin:0}
.info b{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.info a{color:inherit;font-weight:700}
.pill{font-size:11.5px;font-weight:800;padding:5px 9px;border-radius:8px;white-space:nowrap}
.pill.ok{background:#1f8a4c;color:#fff}.pill.off{background:#7c858a;color:#fff}.pill.new{background:var(--red);color:#fff}.pill.ready{background:var(--gold);color:#2a1a00}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.acts .btn{height:38px;font-size:13px}
.st{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  padding:8px 6px calc(8px + var(--safe-b));background:rgba(9,38,48,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
[data-theme=light] .nav{background:rgba(255,255,255,.95)}
.nav button{min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative;padding:4px 0}
.nav button.on{color:var(--gold)}
[data-theme=light] .nav button.on{color:var(--red)}
.nav em{position:absolute;top:-2px;left:calc(50% + 6px);background:var(--red);color:#fff;font-style:normal;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + var(--safe-b));animation:up .25s ease-out;color:var(--text)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet .pim{border-radius:18px;aspect-ratio:1.5/1;background:#0f3d4c center/cover;overflow:hidden;margin-bottom:14px;position:relative}
.sheet h3{margin:0 0 6px;font-size:20px;line-height:1.25}
.sheet .price b{color:#ff5a5f}
[data-theme=light] .sheet .price b{color:var(--red)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fd{from{opacity:0}}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%);background:#123b4a;color:#fff;border:1px solid var(--line);padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:60;box-shadow:var(--shadow);animation:fd .2s}
.pin{display:flex;gap:10px;justify-content:center;margin:18px 0}
.pin input{width:54px;height:62px;text-align:center;font-size:26px;font-weight:800;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);color:var(--text)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ck{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:600;font-size:14px}
.ck input{width:20px;height:20px;accent-color:var(--red)}
.thumb{width:54px;height:54px;border-radius:12px;background:#0f3d4c center/cover;flex:none;overflow:hidden}
.chbtn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;height:48px}
.chbtn.max{background:linear-gradient(135deg,#7b3cff,#3d7bff)}.chbtn.tg{background:linear-gradient(135deg,#2aa3e0,#1c7fc0)}
.pctrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.pctrow button{height:42px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:800}
.pctrow button.on{background:var(--red);border-color:var(--red);color:#fff}
.acts4{grid-template-columns:1fr 1fr}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 13px}
.kpi .l{font-size:12px;font-weight:700;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi .dl{font-size:12px;font-weight:700;margin-top:3px;color:var(--muted)}
.kpi .dl.up{color:#3fbf7f}.kpi .dl.down{color:#ff7a7e}
[data-theme=light] .kpi .dl.up{color:#16824a}[data-theme=light] .kpi .dl.down{color:#c4161c}
.ch-t{font-weight:800;font-size:15.5px}.ch-s{font-size:12px;color:var(--muted);margin:2px 0 10px}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line);position:relative;margin-top:22px}
.bars .b{flex:1;min-width:2px;border-radius:4px 4px 0 0;background:var(--gold);position:relative;cursor:pointer}
.bars .b:after{content:"";position:absolute;inset:-60px -1px 0}
.bars.rev .b{background:#ff5a5f}[data-theme=light] .bars.rev .b{background:var(--red)}
.bars .b.hi{filter:brightness(1.25)}
.bars .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
.bars .gl span{position:absolute;right:0;top:-17px;font-size:10.5px;color:var(--muted)}
.xax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:5px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center;margin-bottom:9px;font-size:13px}
.hb .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .v{font-weight:800;font-variant-numeric:tabular-nums}
.hb .tr{grid-column:1/-1;height:8px;border-radius:4px;background:color-mix(in srgb,var(--line) 60%,transparent);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:4px;background:var(--gold)}
.hb.red .tr i{background:#ff5a5f}[data-theme=light] .hb.red .tr i{background:var(--red)}
.split{display:flex;height:12px;gap:2px;border-radius:6px;overflow:hidden;margin:10px 0 8px}
.split i{display:block;height:100%}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:600}
.leg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.demo-ban{background:linear-gradient(135deg,rgba(228,180,90,.2),rgba(228,180,90,.08));border:1.5px dashed var(--gold);border-radius:14px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px;line-height:1.4}
.tip{position:fixed;z-index:70;pointer-events:none;background:#0b2530;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:7px 10px;font-size:12px;font-weight:600;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.35);white-space:nowrap}
.mini-tabs{display:flex;gap:6px;margin-bottom:12px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
</style>

const ILL = {

const ICON_TG='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 4.2 2.9 11.4c-1.2.5-1.2 1.2-.2 1.5l4.7 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.4l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.8-1.3-1.5zM9.6 14.3l-.4 4 -1.4-4.6 10.6-6.7z"/></svg>';

  mega:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10v4h3l7 4V6L7 10z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>',
  moon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',

  arrow:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>'
};

/* ---------- storage ---------- */
const KEY='krabamore_v1';
function defaults(){return {ov:{},added:[],del:{},orders:[],cart:{},theme:'dark',notif:true,seen:0,
  news:[{id:1,t:'Каталог обновлён',x:'Актуальные цены по прайсу на '+(window.PRICE_DATE||'')+'. Более 800 позиций: краб, креветка, рыба, икра и готовые блюда.',at:Date.now()-3600e3}]}}
let S; try{S=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Не удалось сохранить: память браузера заполнена')}}
let seller=false; try{seller=sessionStorage.getItem('km_seller')==='1'}catch(e){}
if(!S.uid){S.uid=Math.random().toString(36).slice(2,12)+Date.now().toString(36);save()}
function track(e,id){ if(DEMO) return; try{const W=window.WebApp;fetch('/api/track',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify({e,id,uid:S.uid,initData:e==='open'?((W&&W.initData)||''):undefined})}).catch(()=>{})}catch(x){} }
let sellerPin=''; try{sellerPin=sessionStorage.getItem('km_pin')||''}catch(e){}
async function sellerApi(path,opt={}){const r=await fetch('/api/seller'+path,Object.assign({},opt,{headers:Object.assign({'Content-Type':'application/json','X-Seller-Pin':sellerPin},opt.headers||{})}));if(r.status===401)throw new Error('pin');return r.json()}

/* ---------- products ---------- */
let PRODUCTS=[];
function rebuild(){
  const base=(window.PRODUCTS||[]).filter(p=>!S.del[p.id]).map(p=>Object.assign({},p,S.ov[p.id]||{}));
  PRODUCTS=S.added.filter(p=>!S.del[p.id]).map(p=>Object.assign({},p,S.ov[p.id]||{})).concat(base);
  const now=Date.now();PRODUCTS.forEach(p=>{if(p.old&&p.until&&now>p.until){p.p=p.old;p.old=0}});
}
rebuild();
const byId=id=>PRODUCTS.find(p=>p.id===id);
const norm=s=>(s||'').toLowerCase().replace(/ё/g,'е');
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const unitLabel=u=>u==='кг'?'кг':'шт';
const fmtQ=(q,u)=>u==='кг'?(q<1?Math.round(q*1000)+' г':q.toLocaleString('ru-RU',{maximumFractionDigits:2})+' кг'):q+' шт';
const stepOf=p=>p.u==='кг'?(p.p>=5000?0.1:0.5):1;
const round2=x=>Math.round(x*100)/100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PH="style=\"background:url('img/logo.webp') center/66% no-repeat,radial-gradient(circle at 50% 40%,#e8333a,#b3121a 75%)\"";
function imgHtml(p){ return p.img?`style="background-image:url('${p.img}')"`:PH }
function illHtml(p){ return '' }
const onSale=p=>p.old>p.p&&p.p>0;
const pct=p=>Math.round((1-p.p/p.old)*100);

/* ---------- ui helpers ---------- */
const $=s=>document.querySelector(s);
const main=$('#main');
let tab='catalog', stab='stats';
const UI={cat:'all',q:'',sort:'pop',limit:24,sq:'',scat:'all',slimit:40,hiddenOnly:false,method:'pickup'};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1900)}
function sheet(html,onMount){
  const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()});
  document.body.appendChild(ov); onMount&&onMount(ov.querySelector('.sheet'),()=>ov.remove()); return ov;
}
function haptic(){try{(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback.impactOccurred('light'))||(window.WebApp&&WebApp.HapticFeedback&&WebApp.HapticFeedback.impactOccurred('light'))}catch(e){}}

/* ---------- theme ---------- */
function applyTheme(){document.documentElement.dataset.theme=S.theme;$('#themeBtn').innerHTML=S.theme==='dark'?ICON.moon:ICON.sun}
$('#themeBtn').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';save();applyTheme()};
applyTheme();

/* ---------- mode switch ---------- */
$('#segBuyer').onclick=()=>{setMode(false)};
$('#segSeller').onclick=()=>{ if(seller) return setMode(true); askPin(); };
function setMode(s){seller=s;try{sessionStorage.setItem('km_seller',s?'1':'0')}catch(e){}
  $('#segBuyer').classList.toggle('on',!s);$('#segSeller').classList.toggle('on',s);render();window.scrollTo({top:0})}
async function checkPin(v){ if(DEMO) return v===CONFIG.sellerPin; try{const r=await fetch('/api/seller?days=1',{headers:{'X-Seller-Pin':v}});return r.ok}catch(e){return false} }
function askPin(){
  sheet(`<h3>Вход для продавца</h3><div class="li-sub">Введите PIN-код магазина</div>
    <div class="pin">${[0,1,2,3].map(i=>`<input inputmode="numeric" maxlength="1" data-i="${i}">`).join('')}</div>
    <div class="err hidden" id="pinErr">Неверный PIN</div>${DEMO?'<div class="note" style="padding:0;text-align:center">В демо PIN: 1234</div>':''}`,(el,close)=>{
    const ins=[...el.querySelectorAll('input')]; ins[0].focus();
    ins.forEach((inp,i)=>{inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,'');if(inp.value&&i<3)ins[i+1].focus();
      const v=ins.map(x=>x.value).join('');if(v.length===4)checkPin(v).then(ok=>{if(ok){sellerPin=v;try{sessionStorage.setItem('km_pin',v)}catch(e){}close();setMode(true);toast('Режим продавца')}else{el.querySelector('#pinErr').classList.remove('hidden');ins.forEach(x=>x.value='');ins[0].focus()}})};
      inp.onkeydown=e=>{if(e.key==='Backspace'&&!inp.value&&i>0)ins[i-1].focus()}});
  });
}

/* ---------- nav ---------- */
function cartCount(){return Object.keys(S.cart).filter(id=>byId(id)).length}
function unreadNews(){return S.news.filter(n=>n.at>S.seen).length}
function renderNav(){
  const items=seller?[['stats','Аналитика',ICON.chart],['products','Товары',ICON.box],['add','Добавить',ICON.plus],['orders','Заказы',ICON.list,S.orders.filter(o=>o.status==='new').length],['mail','Рассылка',ICON.mega]]
    :[['catalog','Каталог',ICON.grid],['cart','Заказ',ICON.bag,cartCount()],['news','Новости',ICON.bell,unreadNews()],['shop','Магазин',ICON.pin]];
  const cur=seller?stab:tab;
  $('#nav').style.gridTemplateColumns=`repeat(${items.length},1fr)`;
  $('#nav').innerHTML=items.map(([id,t,ic,b])=>`<button data-t="${id}" class="${cur===id?'on':''}">${ic}${t}${b?`<em>${b}</em>`:''}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(seller)stab=b.dataset.t;else tab=b.dataset.t;render();window.scrollTo({top:0})});
}
function render(){
  if(seller){({stats:sStats,products:sProducts,add:()=>sEdit(null,true),orders:sOrders,mail:sMail})[stab]()}
  else{({catalog:catalog,cart:cart,news:news,shop:shop,sale:sale})[tab]()}
  renderNav();
}

/* =================== BUYER =================== */
function catalogHead(){
  return `  <div class="promo" id="promo" role="button" aria-label="Акции и скидки">
    <div class="pr-img"></div><div class="pr-shine"></div>
    <svg class="tag" viewBox="0 0 120 100" aria-hidden="true"><defs>
      <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ffe3c2"/></linearGradient>

      <path d="M86 8c10 0 14 8 8 16" fill="none" stroke="#f3c77a" stroke-width="2.5" stroke-linecap="round"/>
      <g transform="rotate(-16 60 52)"><path d="M30 26h48a6 6 0 0 1 5 3l13 21-13 21a6 6 0 0 1-5 3H30a8 8 0 0 1-8-8V34a8 8 0 0 1 8-8z" fill="url(#tg)" filter="drop-shadow(0 4px 6px rgba(80,0,0,.45))"/>
      <circle cx="82" cy="50" r="4.5" fill="#c4161c"/><text x="51" y="63" font-family="Montserrat,sans-serif" font-weight="800" font-size="34" fill="#d01a20" text-anchor="middle">%</text></g>
      <g fill="url(#ice)" stroke="#fff" stroke-opacity=".7" stroke-width=".8"><rect x="4" y="74" width="18" height="16" rx="4" transform="rotate(-12 13 82)"/><rect x="18" y="82" width="15" height="13" rx="3.5" transform="rotate(14 25 88)"/><rect x="0" y="88" width="13" height="11" rx="3"/></g>
      <g fill="#fff"><circle cx="104" cy="22" r="1.6"/><circle cx="12" cy="24" r="1.2"/><circle cx="108" cy="80" r="1.3"/></g>
    </svg>
    <div class="t"><div class="t1">Акции и скидки</div><div class="t2">Выгодные цены недели</div></div>
    <div class="go">${ICON.arrow}</div>
  </div>`;
}
function catalog(){
  main.innerHTML=catalogHead()+`
  <div class="sec-h"><h2>Каталог</h2><button class="lnk" id="allBtn">Смотреть все ${ICON.arrow}</button></div>
  <div class="search">${ICON.search}<input id="q" placeholder="Поиск: нерка, краб, икра кеты…" value="${esc(UI.q)}" autocomplete="off"><button class="clr ${UI.q?'':'hidden'}" id="qc">×</button></div>
  <div class="cats" id="cats">${CATS.map(c=>c.id==='all'
     ?`<button class="cat all ${UI.cat==='all'?'on':''}" data-c="all">${ICON.grid}<div class="lb">Все</div></button>`
     :`<button class="cat ${UI.cat===c.id?'on':''}" data-c="${c.id}"><div class="ph" ${c.img?`style="background-image:url('${c.img}')"`:'style="background:radial-gradient(circle at 30% 20%,#1c6a80,#0b3442 70%)"'}>${c.img?'':`<div style="width:34px">${ILL[c.ill]}</div>`}</div><div class="lb">${c.t}</div></button>`).join('')}</div>
  <div class="sorts">${[['pop','Популярное'],['asc','Дешевле'],['desc','Дороже'],['own','Своё производство']].map(([k,t])=>`<button class="chip ${UI.sort===k?'on':''}" data-s="${k}">${t}</button>`).join('')}</div>
  <div class="count" id="cnt"></div>
  <div class="grid" id="grid"></div>
  <button class="btn ghost more hidden" id="more">Показать ещё</button>`;
  $('#promo').onclick=()=>{const m=S.promoMode||'section';if(m==='max')return openExt(CONFIG.maxChannel);if(m==='tg')return openExt(CONFIG.tgChannel);tab='sale';render();window.scrollTo({top:0})};
  $('#allBtn').onclick=()=>{UI.cat='all';UI.q='';UI.sort='pop';UI.limit=24;catalog();document.getElementById('cats').scrollIntoView({behavior:'smooth',block:'start'})};
  const q=$('#q');let tmr;
  q.oninput=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{UI.q=q.value;UI.limit=24;$('#qc').classList.toggle('hidden',!UI.q);fillGrid()},180)};
  $('#qc').onclick=()=>{UI.q='';q.value='';$('#qc').classList.add('hidden');fillGrid()};
  $('#cats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>{UI.cat=b.dataset.c;UI.limit=24;$('#cats').querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x===b));fillGrid()});

async function submitOrder(){

  const lines=cartLines();
  const order={id:'KM-'+String(Date.now()).slice(-5),at:Date.now(),name,phone,method:UI.method,addr,com,status:'new',

function bindTips(root){root.querySelectorAll('[data-tip]').forEach(el=>{
  const show=e=>{if(!tipEl){tipEl=document.createElement('div');tipEl.className='tip';document.body.appendChild(tipEl)}tipEl.textContent=el.dataset.tip;tipEl.style.display='block';
    const r=el.getBoundingClientRect();const w=tipEl.offsetWidth;tipEl.style.left=Math.min(innerWidth-w-8,Math.max(8,r.left+r.width/2-w/2))+'px';tipEl.style.top=Math.max(8,r.top-tipEl.offsetHeight-8)+'px';
    root.querySelectorAll('.b.hi').forEach(x=>x.classList.remove('hi'));el.classList.add('hi')};
  el.addEventListener('pointerenter',show);el.addEventListener('click',show);el.addEventListener('pointerleave',()=>{if(tipEl)tipEl.style.display='none';el.classList.remove('hi')});
})}
window.addEventListener('scroll',()=>{if(tipEl)tipEl.style.display='none'},{passive:true});
